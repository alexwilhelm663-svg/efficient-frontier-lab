name: Verbesserung
description: Eine konkrete Funktion oder Modellverbesserung planen
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Gewünschtes Verhalten
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Prüfkriterien
      description: Woran erkennen wir, dass die Funktion korrekt arbeitet?
